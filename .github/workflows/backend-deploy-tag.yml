name: Build and Push Docker Image by Tag

on:
  push:
    tags:
      - 'v*'  # Trigger for tags that start with "v", e.g., v1.0.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker Image
        run: |
          cd server
          # Build the image and tag it with the Git tag (github.ref_name returns the tag name)
          docker build -t documentinterrogator-server:${{ github.ref_name }} .

      - name: Tag Docker Image
        run: |
          # Tag the image with both the Git tag and "latest"
          docker tag documentinterrogator-server:${{ github.ref_name }} 713881829966.dkr.ecr.us-west-2.amazonaws.com/documentinterrogator-server:${{ github.ref_name }}
          docker tag documentinterrogator-server:${{ github.ref_name }} 713881829966.dkr.ecr.us-west-2.amazonaws.com/documentinterrogator-server:latest

      - name: Push Docker Image to ECR
        run: |
          docker push 713881829966.dkr.ecr.us-west-2.amazonaws.com/documentinterrogator-server:${{ github.ref_name }}
          docker push 713881829966.dkr.ecr.us-west-2.amazonaws.com/documentinterrogator-server:latest
